name: Compilar APK Al Día

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Validar proyecto Android
        run: gradle :app:lintDebug --stacktrace

      - name: Compilar APK debug
        run: gradle :app:assembleDebug --stacktrace

      - name: Renombrar APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Al-Dia-debug.apk

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Al-Dia-APK
          path: release/Al-Dia-debug.apk
          if-no-files-found: error
          retention-days: 30
