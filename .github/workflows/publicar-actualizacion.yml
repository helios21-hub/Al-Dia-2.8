name: Publicar actualización Al Día


on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Obtener versión
        id: version
        shell: bash
        run: |
          VERSION=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validar proyecto Android
        run: gradle :app:lintDebug --stacktrace

      - name: Compilar APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Preparar APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/Al-Dia-v${{ steps.version.outputs.version }}.apk"

      - name: Publicar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          FILE="release/Al-Dia-v${{ steps.version.outputs.version }}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" \
              --title "Al Día v${{ steps.version.outputs.version }}" \
              --notes "Actualización de Al Día v${{ steps.version.outputs.version }}."
          fi
